name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: ./scripts/build.ps1 -Configuration Release

  installers:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: windows-2025
    strategy:
      matrix:
        runtime: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Install Inno Setup
        shell: pwsh
        run: |
          $setup = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.4.exe'
          $destination = Join-Path $env:RUNNER_TEMP 'PrintBridge-Inno'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_4/innosetup-6.7.4.exe' -OutFile $setup
          $signature = Get-AuthenticodeSignature $setup
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Pyrsys') {
              throw 'Inno Setup signature verification failed'
          }
          $process = Start-Process $setup -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /CURRENTUSER /NORESTART /DIR=`"$destination`"" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Inno Setup exited with $($process.ExitCode)" }
          "PRINTBRIDGE_ISCC=$(Join-Path $destination 'ISCC.exe')" >> $env:GITHUB_ENV
      - name: Build release packages
        env:
          PRINTBRIDGE_RUNTIME: ${{ matrix.runtime }}
        shell: pwsh
        run: |
          $tool = Join-Path $env:RUNNER_TEMP 'PrintBridge-WiX'
          dotnet tool install wix --version 6.0.2 --tool-path $tool
          if ($LASTEXITCODE -ne 0) { throw 'WiX installation failed' }
          ./scripts/build-release-packages.ps1 -Runtime $env:PRINTBRIDGE_RUNTIME -Wix (Join-Path $tool 'wix.exe')
      - name: Verify x64 MSI installation
        if: matrix.runtime == 'win-x64'
        shell: pwsh
        run: |
          $msi = (Get-ChildItem artifacts/dist/win-x64 -Filter *.msi).FullName
          $log = Join-Path $env:RUNNER_TEMP 'printbridge-msi.log'
          $target = Join-Path $env:LOCALAPPDATA 'Programs/PrintBridge/PrintBridge.exe'
          $install = Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /qn /norestart /L*v `"$log`"" -Wait -PassThru
          if ($install.ExitCode -ne 0 -or -not (Test-Path $target)) {
              if (Test-Path $log) { Get-Content $log -Tail 80 }
              throw "MSI installation failed with exit code $($install.ExitCode)"
          }
          $remove = Start-Process msiexec.exe -ArgumentList "/x `"$msi`" /qn /norestart /L*v `"$log`"" -Wait -PassThru
          if ($remove.ExitCode -ne 0 -or (Test-Path $target)) {
              if (Test-Path $log) { Get-Content $log -Tail 80 }
              throw "MSI removal failed with exit code $($remove.ExitCode)"
          }
      - uses: actions/upload-artifact@v7
        with:
          name: PrintBridge-${{ matrix.runtime }}
          path: artifacts/dist/${{ matrix.runtime }}/*
          if-no-files-found: error
          compression-level: 0
